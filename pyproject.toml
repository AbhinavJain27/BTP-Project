[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="river-networks"
version="0.1.0"
description="Benchmark repository and graph-analytic toolkit for global and Indian river networks"
requires-python=">=3.10"
dependencies=[
"pandas>=2.0",
"numpy>=1.24",
"scipy>=1.10",
"geopandas>=0.14",
"shapely>=2.0",
"pyogrio>=0.7",
"pyarrow>=14.0",
"igraph>=0.11",
"PyYAML>=6.0",
"streamlit>=1.36",
"plotly>=5.20"
]

[project.scripts]
river-networks="river_networks.cli:main"

[tool.setuptools]
package-dir={""="src"}

[tool.setuptools.packages.find]
where=["src"]
